name: Deploy Angular SSR to OCI

on:
  push:
    branches: [main]

concurrency:
  group: deploy-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "Dockerfile,package.json,package-lock.json,angular.json,tsconfig*.json,src"
          target: "/home/opc/app"
          rm: true

      - name: Build and run Docker container via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/opc/app
            docker build -t f1-app-image .
            docker stop f1-app || true
            docker rm f1-app || true
            docker run -d --name f1-app -p 127.0.0.1:4000:4000 f1-app-image