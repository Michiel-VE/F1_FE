<div class="min-h-screen bg-slate-950 text-slate-100 p-6 md:p-12">
  <div class="max-w-4xl mx-auto h-[calc(100vh-6rem)] flex flex-col">
    <div
      class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-800 pb-6 mb-8 flex-shrink-0"
    >
      <div>
        <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-white">
          {{ title() }}
        </h2>
        <p class="text-sm text-slate-400 mt-1">{{ subtitle() }}</p>
      </div>
      <button
        (click)="goBack()"
        class="inline-flex items-center justify-center rounded-lg bg-slate-800 px-4 py-2.5 text-sm font-semibold text-slate-200 shadow-sm hover:bg-slate-700 transition-colors duration-150 ease-in-out focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-600 cursor-pointer"
      >
        <svg class="w-3.5 h-3.5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M15 19l-7-7 7-7"
          />
        </svg>
        Dashboard
      </button>
    </div>

    <div class="space-y-3 overflow-y-auto pr-1">
      @for (team of savedTeams(); track team.id; let i = $index) {
        <div
          class="flex items-center gap-4 bg-slate-900 border border-slate-800/60 rounded-xl p-4 shadow-sm hover:border-slate-700/80 transition-all duration-150"
        >
          <div
            class="flex items-center justify-center w-8 h-8 rounded-lg bg-slate-950 border border-slate-800 font-mono text-sm font-bold text-red-600"
          >
            {{ i + 1 }}
          </div>
          <div class="flex-1 min-w-0">
            <span class="block text-base font-semibold text-slate-200 truncate">{{
              team.name
            }}</span>
          </div>
          <div
            class="inline-flex items-center px-2.5 py-1 rounded-md bg-slate-950 border border-slate-800 font-mono text-xs font-medium text-slate-400 uppercase tracking-wider"
          >
            {{ team.shortName }}
          </div>
        </div>
      } @empty {
        <div
          class="flex flex-col items-center justify-center text-center p-12 rounded-2xl border border-dashed border-slate-800 bg-slate-900/20"
        >
          <p class="text-sm font-medium text-slate-400">No saved prediction configuration found.</p>
        </div>
      }
    </div>
  </div>
</div>
