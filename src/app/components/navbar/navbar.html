<nav class="bg-black border-b border-gray-700 text-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      <a routerLink="/" class="text-red-600 font-bold text-xl">F1_API</a>

      <ul class="hidden md:flex space-x-8">
        @for (link of links; track link.name) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="text-red-600 border-b-2 border-red-600"
              class="text-gray-300 hover:text-red-500 transition-colors duration-200 font-medium"
            >
              {{ link.name }}
            </a>
          </li>
        }
      </ul>

      <button
        class="md:hidden focus:outline-none text-gray-300 hover:text-red-500"
        (click)="toggleMenu()"
      >
        @if (!isMenuOpen) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (isMenuOpen) {
    <div class="md:hidden bg-gray-900 border-t border-gray-800">
      <ul class="flex flex-col space-y-2 px-4 py-3">+
        @for (link of links; track link.name) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="text-red-600"
              class="block text-gray-300 hover:text-red-500 transition-colors duration-200"
            (click)="toggleMenu()"
          >
            {{ link.name }}
          </a>
        </li>
      }
      </ul>
    </div>
  }
</nav>
