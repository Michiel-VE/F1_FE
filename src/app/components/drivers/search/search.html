<div>
  <div class="max-w-xs m-6 rounded-xl border-2 border-indigo-300">
    <form
      [formGroup]="searchForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col sm:flex-row items-stretch sm:space-x-3 space-y-4 sm:space-y-0"
    >
      <div>
        <label for="season-year" class="sr-only">Select Season Year</label>
        <div class="relative inline-block w-full sm:w-auto">
          <select
            id="season-year"
            formControlName="seasonYear"
            (change)="onSubmit()"
            class="w-full py-2 pl-8 pr-10 rounded-xl appearance-none transition duration-150 ease-in-out shadow-inner text-gray-700 bg-indigo-50 hover:bg-indigo-100 focus:ring-indigo-500 focus:border-indigo-500 dark:text-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 dark:border-gray-700 dark:focus:ring-indigo-400 dark:shadow-none"
          >
            @for (year of years(); track year) {
              <option
                [value]="year"
                class="bg-gray-800 text-white checked:bg-gray-700"
              >
                {{ year }}
              </option>
            }
          </select>

          <div
            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500 dark:text-gray-400"
          >
            <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20">
              <path
                d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
              />
            </svg>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
