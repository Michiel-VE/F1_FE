<article
  class="group relative bg-white/[0.03] border border-white/[0.08] rounded-xl overflow-hidden p-5 pl-14 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-2xl h-full flex flex-col"
>
  <div
    class="absolute left-0 top-0 bottom-0 w-[3px] z-20"
    [style.background]="borderAccent(position())"
  ></div>

  <div class="absolute left-2.5 top-5 w-9 h-9 flex items-center justify-center">
    <span class="text-2xl font-black leading-none" [class]="posNumClass()">
      {{ position() }}
    </span>
  </div>

  <div class="relative mb-3">
    <div class="flex items-center gap-2 mb-0.5">
      <span
        class="text-[0.65rem] font-bold tracking-[0.15em] uppercase px-1.5 py-0.5 rounded bg-white/[0.06] border border-white/[0.08]"
        [class]="accentTextClass()"
        >{{ team().shortName }}</span
      >
      @if (isPodium()) {
        <span class="text-[0.6rem] font-semibold tracking-wider uppercase text-gray-300">
          P{{ position() }}
        </span>
      }
    </div>
    <h2 class="text-xl font-black text-white leading-tight tracking-tight break-words">
      {{ team().name }}
    </h2>
  </div>

  <div class="flex-1"></div>

  <div class="mt-auto">
    <div class="h-px bg-white/[0.06] w-full mb-3"></div>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div class="flex items-center">
        <p class="text-sm font-medium uppercase text-gray-400">Points</p>
      </div>
      <div class="flex justify-end items-end gap-1.5 mr-3">
        <p class="text-md sm:text-xl font-semibold text-white">
          {{ team().totalPoints }}
        </p>
      </div>
    </div>

    <div class="h-px bg-white/[0.06] w-full mb-4"></div>
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-white/[0.04] border border-white/[0.06] rounded-lg px-3 py-2.5">
        <p class="text-[0.6rem] font-medium tracking-[0.12em] uppercase text-gray-400 mb-1">
          Country
        </p>
        <div class="flex items-center gap-1.5">
          <svg class="w-3 h-3 text-gray-500 flex-shrink-0" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 1.5v13M1.5 8h13" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <p class="text-sm sm:text-md font-semibold text-white truncate">
            {{ team().country }}
          </p>
        </div>
      </div>

      <div class="bg-white/[0.04] border border-white/[0.06] rounded-lg px-3 py-2.5">
        <p class="text-[0.6rem] font-medium tracking-[0.12em] uppercase text-gray-400 mb-1">Base</p>
        <div class="flex items-center gap-1.5">
          <svg class="w-3 h-3 text-gray-500 flex-shrink-0" viewBox="0 0 16 16" fill="none">
            <path
              d="M8 1.5C5.5 1.5 3.5 3.5 3.5 6c0 3.5 4.5 8.5 4.5 8.5S12.5 9.5 12.5 6c0-2.5-2-4.5-4.5-4.5z"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <circle cx="8" cy="6" r="1.5" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <p class="text-sm sm:text-md font-semibold text-white truncate">
            {{ team().base }}
          </p>
        </div>
      </div>
    </div>
  </div>
</article>
