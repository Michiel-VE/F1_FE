<article
  class="group relative bg-gradient-to-b from-white/[0.05] to-white/[0.01] backdrop-blur-xl border border-white/10 rounded-2xl p-6 overflow-hidden transition-all duration-300 hover:-translate-y-1 hover:border-white/30 hover:bg-white/[0.06] shadow-lg h-full flex flex-col justify-between"
>
  <!-- Position Accent Bar -->
  <div
    class="absolute left-0 top-0 bottom-0 w-1 transition-all duration-300 group-hover:w-1.5"
    [class.bg-amber-400]="position() === 1"
    [class.bg-slate-300]="position() === 2"
    [class.bg-orange-400]="position() === 3"
    [class.bg-slate-700]="position() > 3"
  ></div>

  <!-- Rank Number Watermark -->
  <div
    class="absolute right-4 top-3 text-6xl font-black italic tracking-tighter select-none pointer-events-none text-white/[0.03] group-hover:text-white/[0.06] transition-colors"
    aria-hidden="true"
  >
    {{ position() }}
  </div>

  <!-- Upper Content Block -->
  <div class="flex flex-col">
    <!-- Top Row: Position Badge Only -->
    <div class="flex items-center justify-between mb-4">
      <div
        class="w-9 h-9 rounded-xl flex items-center justify-center font-black text-sm border shadow-inner"
        [class.bg-amber-400/10]="position() === 1"
        [class.border-amber-400/30]="position() === 1"
        [class.text-amber-400]="position() === 1"
        [class.bg-slate-300/10]="position() === 2"
        [class.border-slate-300/30]="position() === 2"
        [class.text-slate-300]="position() === 2"
        [class.bg-orange-400/10]="position() === 3"
        [class.border-orange-400/30]="position() === 3"
        [class.text-orange-400]="position() === 3"
        [class.bg-white/5]="position() > 3"
        [class.border-white/10]="position() > 3"
        [class.text-slate-400]="position() > 3"
      >
        P{{ position() }}
      </div>
    </div>

    <!-- Team Names & Short Name Tag Block (Locked min-height for perfect alignment) -->
    <div class="space-y-1.5 min-h-[4.5rem] flex flex-col justify-end">
      @if (team().shortName) {
        <div>
          <span class="inline-block text-[0.65rem] font-bold tracking-wider uppercase px-2 py-0.5 rounded-md bg-white/5 border border-white/10 text-slate-300 shadow-sm truncate max-w-full">
            {{ team().shortName }}
          </span>
        </div>
      }
      <h3 class="text-xl font-black tracking-tight text-white transition-colors leading-tight break-words">
        {{ team().name }}
      </h3>
    </div>
  </div>

  <div class="my-5 h-px bg-white/10 w-full"></div>

  <!-- Footer Info & Stats (Anchored to Bottom) -->
  <div class="space-y-4 mt-auto">
    <!-- Points Section -->
    <div class="flex items-baseline justify-between bg-white/[0.02] border border-white/5 rounded-xl p-3.5">
      <span class="text-xs font-bold tracking-widest uppercase text-slate-400">
        Total Points
      </span>
      <span class="text-2xl font-black tracking-tight text-white">
        {{ team().totalPoints }}
      </span>
    </div>

    <!-- Metadata Grid (Country & Base) -->
    <div class="grid grid-cols-2 gap-2.5">
      <!-- Country Badge -->
      <div class="bg-white/[0.02] border border-white/5 rounded-xl p-3 flex flex-col justify-between">
        <span class="text-[0.65rem] font-bold tracking-widest uppercase text-slate-400 mb-1">
          Country
        </span>
        <div class="flex items-center gap-1.5 truncate">
          <svg class="w-3.5 h-3.5 text-slate-500 flex-shrink-0" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 1.5v13M1.5 8h13" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span class="text-xs font-semibold text-slate-200 truncate" [title]="team().country">
            {{ team().country }}
          </span>
        </div>
      </div>

      <!-- Base Badge -->
      <div class="bg-white/[0.02] border border-white/5 rounded-xl p-3 flex flex-col justify-between">
        <span class="text-[0.65rem] font-bold tracking-widest uppercase text-slate-400 mb-1">
          Base
        </span>
        <div class="flex items-center gap-1.5 truncate">
          <svg class="w-3.5 h-3.5 text-slate-500 flex-shrink-0" viewBox="0 0 16 16" fill="none">
            <path
              d="M8 1.5C5.5 1.5 3.5 3.5 3.5 6c0 3.5 4.5 8.5 4.5 8.5S12.5 9.5 12.5 6c0-2.5-2-4.5-4.5-4.5z"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <circle cx="8" cy="6" r="1.5" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span class="text-xs font-semibold text-slate-200 truncate" [title]="team().base">
            {{ team().base }}
          </span>
        </div>
      </div>
    </div>
  </div>
</article>
