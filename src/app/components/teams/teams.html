<app-header
  title="Constructor Standings"
  [selectedYear]="selectedYear()"
  [(searchedYear)]="year"
  (searchedYearChange)="onYearChange($event)"
/>

<!-- Error -->
@if (error()) {
  <div
    class="mx-4 sm:mx-12 mb-6 flex items-center justify-between gap-4 bg-red-950/40 border border-red-800/50 rounded-xl px-5 py-4"
  >
    <div class="flex items-center gap-3">
      <svg class="w-5 h-5 text-red-400 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm-.75-11.25a.75.75 0 011.5 0v4.5a.75.75 0 01-1.5 0v-4.5zm.75 7.5a.75.75 0 100-1.5.75.75 0 000 1.5z"
          clip-rule="evenodd"
        />
      </svg>
      <p class="text-sm text-red-300">{{ error()!.message }}</p>
    </div>
    @if (error()!.canRetry) {
      <button
        (click)="retryFetch()"
        class="text-xs font-semibold text-red-400 border border-red-700/60 rounded-lg px-3 py-1.5 hover:bg-red-900/40 transition-colors whitespace-nowrap"
      >
        Try again
      </button>
    }
  </div>
}

<!-- Grid -->
<section
  class="mx-4 sm:mx-12 pb-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 items-stretch"
>
  @if (isLoading()) {
    @for (i of [1, 2, 3, 4, 5, 6]; track i) {
      <div
        class="relative bg-white/[0.03] border border-white/[0.07] rounded-xl p-5 overflow-hidden animate-pulse"
      >
        <div class="flex flex-col gap-3">
          <div class="flex justify-between items-start">
            <div class="flex flex-col gap-2">
              <div class="h-3 bg-white/[0.06] rounded w-16"></div>
              <div class="h-6 bg-white/[0.06] rounded w-36"></div>
            </div>
            <div class="w-10 h-10 rounded-lg bg-white/[0.06]"></div>
          </div>
          <div class="h-px bg-white/[0.04]"></div>
          <div class="grid grid-cols-2 gap-2">
            <div class="h-12 bg-white/[0.06] rounded-lg"></div>
            <div class="h-12 bg-white/[0.06] rounded-lg"></div>
          </div>
        </div>
      </div>
    }
  } @else {
    @for (team of teams(); track team.id; let idx = $index) {
      <app-team-card [team]="team" [position]="idx + 1" />

    } @empty {
      <div class="col-span-full flex flex-col items-center gap-3 py-20 text-center">
        <svg class="w-12 h-12 text-gray-600" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="1.5" />
          <path
            d="M16 30c2-3.5 5-5 8-5s6 1.5 8 5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <circle cx="18" cy="20" r="2" fill="currentColor" />
          <circle cx="30" cy="20" r="2" fill="currentColor" />
        </svg>
        <p class="text-xl font-bold text-gray-400">No teams found</p>
        <p class="text-sm text-gray-600">Check back later for updates.</p>
      </div>
    }
  }
</section>
