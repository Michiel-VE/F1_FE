<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-l-4 border-red-600 pl-3 shrink-0 select-none">
  <div>
    <div class="flex items-center gap-2">
      <h2 class="text-white font-black uppercase italic tracking-tighter text-2xl sm:text-3xl">
        {{ title }}
      </h2>
      @if (badgeText) {
        <span [class]="badgeClass" class="text-[0.55rem] border px-2 py-0.5 font-bold uppercase tracking-widest rounded-xs">
          {{ badgeText }}
        </span>
      }
    </div>
    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mt-1">
      {{ subtitle }}
    </p>
  </div>

  <div class="flex gap-3 w-full md:w-auto">
    @if (showActionButtons) {
      <button 
        (click)="joinGroup.emit()"
        class="flex-1 md:flex-initial bg-zinc-900 border border-white/10 hover:border-white/30 text-white font-black text-xs uppercase italic tracking-widest px-5 py-3 rounded-xs transition-all cursor-pointer"
      >
        Join Group
      </button>
      <button 
        (click)="createGroup.emit()"
        class="flex-1 md:flex-initial bg-red-600 hover:bg-red-700 text-white font-black text-xs uppercase italic tracking-widest px-5 py-3 rounded-xs transition-all shadow-lg shadow-red-600/10 cursor-pointer"
      >
        Create Group Pool
      </button>
    }
    @if (showDashboardButton) {
      <button 
        (click)="navigateBack.emit()"
        class="flex-1 md:flex-initial bg-neutral-900 hover:bg-neutral-800 border border-white/5 text-gray-400 hover:text-white font-black text-xs uppercase italic tracking-widest px-5 py-3 rounded-xs transition-all cursor-pointer inline-flex items-center justify-center gap-1.5"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
        </svg>
        Dashboard
      </button>
    }
  </div>
</div>
