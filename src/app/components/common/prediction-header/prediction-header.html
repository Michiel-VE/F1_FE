<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-5 mb-8 pl-4 border-l-4 border-red-600 shrink-0">
  <div class="min-w-0">
    <div class="flex flex-wrap items-center gap-2.5">
      <h2 class="text-white font-black uppercase italic tracking-tight text-2xl sm:text-3xl leading-none">
        {{ title }}
      </h2>
      @if (badgeText) {
        <span
          [class]="badgeClass"
          class="text-[0.6875rem] border px-2.5 py-1 font-extrabold uppercase tracking-[0.14em] rounded-xs"
        >
          {{ badgeText }}
        </span>
      }
    </div>
    <p class="text-xs text-zinc-300 font-bold uppercase tracking-[0.12em] mt-2 leading-relaxed">
      {{ subtitle }}
    </p>
  </div>

  <div class="flex flex-wrap sm:flex-nowrap items-center gap-3 w-full md:w-auto shrink-0">
    @if (showActionButtons) {
      <button
        type="button"
        (click)="joinGroup.emit()"
        class="flex-1 sm:flex-initial bg-[#090c10] hover:bg-white/[0.06] border border-white/15 hover:border-white/30 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500 text-white font-black text-xs uppercase italic tracking-[0.12em] px-5 py-3 rounded-xs transition-colors cursor-pointer whitespace-nowrap"
      >
        Join Group
      </button>
      <button
        type="button"
        (click)="createGroup.emit()"
        class="flex-1 sm:flex-initial bg-red-600 hover:bg-red-500 border border-red-500/40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white text-white font-black text-xs uppercase italic tracking-[0.12em] px-5 py-3 rounded-xs transition-colors shadow-md shadow-red-950/50 cursor-pointer whitespace-nowrap"
      >
        Create Group Pool
      </button>
    }
    @if (showDashboardButton) {
      <button
        type="button"
        (click)="navigateBack.emit()"
        class="flex-1 sm:flex-initial bg-[#090c10] hover:bg-white/[0.06] border border-white/15 hover:border-white/30 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500 text-zinc-200 hover:text-white font-black text-xs uppercase italic tracking-[0.12em] px-5 py-3 rounded-xs transition-colors cursor-pointer inline-flex items-center justify-center gap-2 whitespace-nowrap"
      >
        <svg class="w-3.5 h-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
        </svg>
        <span>Dashboard</span>
      </button>
    }
  </div>
</div>
