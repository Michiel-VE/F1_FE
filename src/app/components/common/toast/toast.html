@if (toastService.currentToast(); as toast) {
  <div class="fixed bottom-6 right-6 z-[9999] min-w-[300px] max-w-[450px] rounded-lg p-4 shadow-lg text-white border-l-4 transition-all duration-300 transform translate-y-0"
       [class]="toast.type === 'success' ? 'bg-emerald-500 border-emerald-700' : 'bg-red-500 border-red-700'">
    <div class="flex items-center justify-between gap-3 font-sans text-sm font-medium">
      <span>{{ toast.message }}</span>
      <button class="bg-none border-none text-current text-xl leading-none cursor-pointer opacity-70 hover:opacity-100 px-1 transition-opacity"
              (click)="toastService.clear()">
        &times;
      </button>
    </div>
  </div>
}
