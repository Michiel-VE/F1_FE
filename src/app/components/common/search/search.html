<div class="inline-flex items-center xl:mr-68">
  <form
    [formGroup]="searchForm"
    (ngSubmit)="onSubmit()"
    class="flex items-center"
  >
    <label for="season-year" class="sr-only">Select Season Year</label>
    <div class="relative inline-flex items-center">
      <select
        id="season-year"
        formControlName="seasonYear"
        (change)="onSubmit()"
        class="py-2 pl-4 pr-9 rounded-xl appearance-none transition duration-150 ease-in-out border border-white/10 hover:border-red-500/50 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500/50 text-sm font-semibold text-gray-200 bg-gray-800/90 hover:bg-gray-800 cursor-pointer"
      >
        @for (year of years(); track year) {
          <option
            [value]="year"
            class="bg-gray-900 text-gray-200"
          >
            {{ year }}
          </option>
        }
      </select>

      <div
        class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400"
      >
        <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20">
          <path
            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
          />
        </svg>
      </div>
    </div>
  </form>
</div>
