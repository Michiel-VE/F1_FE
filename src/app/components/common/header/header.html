<section class="mx-4 sm:mx-12 mt-8 mb-6">
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <p class="text-[0.65rem] font-semibold tracking-[0.2em] uppercase text-red-500 mb-1">
        {{ selectedYear() }} Season
      </p>
      <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight leading-none">
        {{ title() }}
      </h1>
    </div>
    <app-search [(searchedYear)]="searchedYear" (searchedYearChange)="onYearChange($event)" />
  </div>
  <div class="mt-3 h-px bg-gradient-to-r from-red-600 via-red-600/30 to-transparent"></div>
</section>
